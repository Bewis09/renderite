plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'maven-publish'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.java
                groupId = 'com.github.bewis09'
                artifactId = 'renderite'
                version = '1.0.0'
            }
        }
    }
}

group = 'net.bewis09.renderite'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    jvmToolchain(20)
}

test {
    useJUnitPlatform()
}